<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formação · Mirian Niz</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="%235c7735"/><circle cx="50" cy="50" r="40" fill="none" stroke="%23f4ecdc" stroke-width="1.6"/><path d="M50 3v9M50 88v9M3 50h9M88 50h9" stroke="%23f4ecdc" stroke-width="1.6"/><path d="M50 22c0 0 -20 12 -20 32c0 14 10 22 20 22c10 0 20 -8 20 -22c0 -20 -20 -32 -20 -32Z" fill="%23f4ecdc"/><path d="M50 30v42" stroke="%235c7735" stroke-width="2" stroke-linecap="round"/><path d="M50 40c-5 2 -9 6 -9 6M50 40c5 2 9 6 9 6M50 52c-6 2 -10 7 -10 7M50 52c6 2 10 7 10 7" stroke="%235c7735" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3a2f22; --ink-soft:#71604a; --paper:#f4ecdc; --panel:#fbf6ea;
    --line:#e2d3b3; --line-strong:#cbb98d;
    --header-bg:#3c4a2c; --header-text:#f1ead3;
    --brand:#7c9a4e; --brand-dark:#5c7735;
    --font-display:'Comfortaa', 'Nunito', sans-serif;
    --font-body:'Nunito', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}

  header{
    background:var(--header-bg); color:var(--header-text);
    padding:44px 24px 38px; text-align:center; position:relative;
  }
  header::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:5px;
    background:var(--brand);
  }
  header a.back{display:inline-flex;align-items:center;gap:6px;font:700 13.5px var(--font-body);
    color:var(--header-bg);background:var(--brand);text-decoration:none;
    padding:9px 18px;border-radius:20px;margin-bottom:20px;transition:opacity .15s ease;}
  header a.back:hover{opacity:.87;}
  header h1{font:700 28px/1.25 var(--font-display); margin:0 0 8px;}
  header p{max-width:560px;margin:0 auto;font-size:15px;line-height:1.6;color:#dfe0cd;}

  main{max-width:1000px;margin:0 auto;padding:48px 24px 80px;}
  .skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;}
  .skill-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;border-top:4px solid var(--accent);}
  .skill-card h3{font:700 15px var(--font-display);margin:0 0 10px;}
  .skill-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .skill-tags span{font-size:10.5px;font-weight:700;color:var(--ink-soft);background:var(--paper);
    border:1px solid var(--line-strong);border-radius:20px;padding:3px 9px;}

  footer{text-align:center;padding:30px 24px 46px;font-size:12.5px;color:var(--ink-soft);}
  footer a{color:var(--brand-dark);font-weight:600;text-decoration:none;}

  @media (max-width:560px){
    header h1{font-size:22px;}
  }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">← Voltar ao portfólio</a>
  <h1>Formação</h1>
  <p>Base científica por trás de cada projeto.</p>
</header>

<main>
  <div class="skills-grid">
    <div class="skill-card" style="--accent:#5c7735"><h3>Doutorado em Ciências</h3><div class="skill-tags"><span>USP São Carlos</span></div></div>
    <div class="skill-card" style="--accent:#5c7735"><h3>Mestrado em Tecnologias Ambientais</h3><div class="skill-tags"><span>UFMS</span></div></div>
    <div class="skill-card" style="--accent:#5c7735"><h3>Pós-doutorado em Gestão de Resíduos</h3><div class="skill-tags"><span>1ª formação</span></div></div>
    <div class="skill-card" style="--accent:#5c7735"><h3>Pós-doutorado em Gestão de Resíduos</h3><div class="skill-tags"><span>2ª formação</span></div></div>
  </div>
</main>

<footer>
  <a href="https://github.com/mirianniz-debug" target="_blank" rel="noopener">github.com/mirianniz-debug</a>
</footer>

</body>
</html>
